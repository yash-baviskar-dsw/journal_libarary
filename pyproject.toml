[tool.pylint.main]
py-version = "3.10"
ignore-paths = [
  "^build/.*$",
  "^dist/.*$",
  "^Docker_Generated_JournalKit_wheel/.*$",
]

[tool.pylint.messages_control]
# Common style noise for small libraries; remove an item to enforce that rule.
disable = [
  "missing-module-docstring",
  "missing-class-docstring",
  "missing-function-docstring",
  "too-few-public-methods",
]

[tool.pylint.format]
max-line-length = 100
