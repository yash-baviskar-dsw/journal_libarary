name: PR CI Tests and Wheel Build

on:
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]

permissions:
  contents: read

jobs:
  python-checks:
    name: Bandit and Pylint
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR merge commit and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install analysis tools
        run: python -m pip install -r requirements-ci.txt

      - name: Run Bandit
        run: bandit --recursive journalkit

      - name: Run Pylint
        run: pylint journalkit

  gitleaks:
    name: Gitleaks
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR merge commit and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan PR commits for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --config .gitleaks.toml \
              --log-opts="$BASE_SHA..$HEAD_SHA" \
              --redact --verbose .

  trufflehog:
    name: TruffleHog
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR merge commit and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan PR commits for secrets
        uses: trufflesecurity/trufflehog@v3.99.8
        with:
          extra_args: --results=verified,unknown --exclude-paths=.trufflehog-exclude-paths.txt
          version: 3.99.8

  build-pr-wheel:
    name: Build PR wheel
    if: github.event.pull_request.draft == false
    needs: [python-checks, gitleaks, trufflehog]
    uses: ./.github/workflows/reusable-build.yml
